<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Discord Clone banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d31"/><stop offset="1" stop-color="#1e1f22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5865f2"/><stop offset="1" stop-color="#7c86ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x="0" y="0" width="10" height="300" rx="5" fill="url(#accent)"/>
  <circle cx="1050" cy="150" r="190" fill="#5865f2" opacity="0.08"/>
  <text x="70" y="130" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="#f2f3f5">Discord Clone</text>
  <text x="72" y="178" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#b5bac1">Real-time chat · voice · video — a self-hostable Discord experience</text>
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="600">
    <rect x="72" y="212" width="150" height="40" rx="20" fill="#5865f2"/><text x="147" y="238" fill="#fff" text-anchor="middle">Next.js 16</text>
    <rect x="234" y="212" width="140" height="40" rx="20" fill="#404249"/><text x="304" y="238" fill="#dbdee1" text-anchor="middle">Prisma 7</text>
    <rect x="386" y="212" width="150" height="40" rx="20" fill="#404249"/><text x="461" y="238" fill="#dbdee1" text-anchor="middle">Socket.io</text>
    <rect x="548" y="212" width="130" height="40" rx="20" fill="#404249"/><text x="613" y="238" fill="#dbdee1" text-anchor="middle">LiveKit</text>
  </g>
</svg>
